[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent365-governance-kit"
version = "0.2.0"
description = "Drop-in Microsoft Purview governance for any Python AI agent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
keywords = ["microsoft", "purview", "agent365", "dlp", "governance", "ai-agent"]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agent365_governance*"]
