name: Proxy image

on:
  push:
    branches: [main]
    paths:
      - "packages/proxy/**"
      - "packages/typescript/**"
      - ".github/workflows/proxy-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish ghcr.io/ohomaidi/agent365-governance-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/proxy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ohomaidi/agent365-governance-proxy:latest
            ghcr.io/ohomaidi/agent365-governance-proxy:${{ github.sha }}
